<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>一站到底 · 生物专场</title>
<style>
:root{
  --bg:#FBF8F1;--ink:#151716;--yellow:#FAE36B;--orange:#EF6A2F;--stone:#E3DFD5;--mute:#6B6A66;
  --green:#9BC5A3;--blue:#9FB7E0;--pink:#F2B5C4;--card:#FFFFFF;--red:#E5604D;
  --font:'Outfit','DM Sans',-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#151716;--ink:#FBF8F1;--stone:#2E3230;--mute:#A8A79F;--card:#1F2321}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{position:relative;height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;padding:8px 12px 10px;gap:6px;outline:none}
.hd{display:flex;align-items:center;gap:8px;min-height:30px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--stone);white-space:nowrap}
.pill.y{background:var(--yellow);color:#151716}
.pill.o{background:var(--orange);color:#151716}
.sp{flex:1}
#mute{border:0;background:var(--stone);border-radius:999px;width:30px;height:30px;font-size:14px;line-height:1}
.tm{display:flex;align-items:center;gap:8px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--stone);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--green);border-radius:99px;transition:background .3s}
.bar i.mid{background:var(--yellow)}
.bar i.low{background:var(--orange)}
#sec{width:26px;text-align:right;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
#sec.low{color:var(--orange)}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.chip{border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;color:#151716;background:var(--stone)}
.stars{color:var(--orange);letter-spacing:1px;font-size:13px}
.qn{margin-left:auto}
#q{flex:1;min-height:56px;display:flex;align-items:center;font-size:17px;font-weight:700;line-height:1.4;padding:2px 2px}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:8px;text-align:left;border:2px solid var(--stone);background:var(--card);border-radius:22px;padding:8px 12px;min-height:54px;font-size:14px;font-weight:600;line-height:1.3;transition:transform .08s,background .15s,border-color .15s,opacity .2s}
.opt b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--stone);display:grid;place-items:center;font-size:12px}
.opt:active{transform:scale(.97)}
.opt:disabled{cursor:default}
.opt.gone{opacity:.22;pointer-events:none;text-decoration:line-through}
.opt.ok{background:var(--green);border-color:var(--green);color:#151716;animation:pop .35s}
.opt.ok b{background:rgba(255,255,255,.55);color:#151716}
.opt.bad{background:var(--red);border-color:var(--red);color:#fff;animation:shake .35s}
.opt.bad b{background:rgba(255,255,255,.3);color:#fff}
.ft{display:flex;gap:6px;justify-content:center}
.ll{flex:1;border:2px solid var(--ink);background:transparent;border-radius:999px;padding:5px 6px;font-size:12px;font-weight:700;white-space:nowrap}
.ll:disabled{opacity:.3;border-color:var(--mute);cursor:default;text-decoration:line-through}
.ll:not(:disabled):hover{background:var(--yellow);color:#151716}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;border-radius:0}
.flash.g{background:var(--green);animation:fl .45s}
.flash.r{background:var(--red);animation:fl .55s}
@keyframes fl{0%{opacity:.5}100%{opacity:0}}
.ov{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:14px 16px;gap:8px;overflow:auto;z-index:5}
.ov.on{display:flex}
.ov::before{content:'';margin-top:auto}
.ov::after{content:'';margin-bottom:auto}
.modes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.mode{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.mode.on{background:var(--yellow);color:#151716;box-shadow:0 3px 0 var(--ink)}
.go.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);padding:7px 20px;font-size:13px;margin-top:0}
.ov h1{margin:0;font-size:26px;line-height:1.15;letter-spacing:.5px}
.ov h1 em{font-style:normal;background:var(--yellow);color:#151716;padding:0 8px;border-radius:12px;display:inline-block}
.ov h2{margin:0;font-size:20px}
.rules{margin:0;padding:0;list-style:none;font-size:13px;color:var(--mute);line-height:1.7;max-width:420px}
.rules li b{color:var(--ink)}
.go{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:11px 30px;font-size:16px;font-weight:800;margin-top:4px}
.go:active{transform:scale(.97)}
.go.o{background:var(--orange);color:#151716}
.big{font-size:40px;font-weight:800;line-height:1}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stat{background:var(--card);border:2px solid var(--stone);border-radius:18px;padding:6px 14px;min-width:84px}
.stat small{display:block;color:var(--mute);font-size:11px}
.stat span{font-size:20px;font-weight:800}
.cats{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:460px}
.cats .chip{font-size:11px}
.ans{background:var(--green);color:#151716;border-radius:18px;padding:8px 14px;font-size:15px;font-weight:800;max-width:440px}
.note{background:var(--card);border:2px dashed var(--stone);border-radius:18px;padding:8px 14px;font-size:13px;line-height:1.5;max-width:440px}
.note b{color:var(--orange)}
.tag{display:inline-block;background:var(--orange);color:#151716;border-radius:999px;padding:2px 12px;font-size:12px;font-weight:800}
#toast{position:absolute;left:50%;top:84px;transform:translate(-50%,-14px);background:var(--yellow);color:#151716;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:8;white-space:nowrap;box-shadow:0 4px 0 rgba(21,23,22,.85)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#cele{position:absolute;inset:0;pointer-events:none;z-index:7;display:none;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;background:rgba(250,227,107,.35)}
#cele.on{display:flex;animation:cin .25s}
#cele .t{background:var(--yellow);color:#151716;border:3px solid #151716;border-radius:24px;padding:10px 24px;font-size:26px;font-weight:900;box-shadow:0 6px 0 #151716;animation:pop .6s}
#cele .s{margin-top:12px;font-weight:800;font-size:14px;background:var(--ink);color:var(--bg);border-radius:999px;padding:3px 14px}
#cele i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(480px) rotate(540deg);opacity:.9}}
@keyframes cin{from{opacity:0}to{opacity:1}}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
@media (max-width:400px){
  #q{font-size:16px}
  .opt{font-size:13px;padding:7px 9px;gap:6px;border-radius:20px}
  .ov h1{font-size:23px}
  .ll{font-size:11px;padding:5px 3px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app" tabindex="0">
  <div class="hd">
    <span class="pill y" id="streak">连对 0</span>
    <span class="pill" id="mult" style="display:none"></span>
    <span class="pill" id="score">0 分</span>
    <span class="sp"></span>
    <button id="mute" title="声音开关" aria-label="声音开关">&#128266;</button>
  </div>
  <div class="tm"><div class="bar"><i id="bar"></i></div><span id="sec">10</span></div>
  <div class="meta"><span class="chip" id="chip">综合</span><span class="stars" id="stars">★</span><span class="qn" id="qn">第 1 题</span></div>
  <div id="q"></div>
  <div id="opts"></div>
  <div class="ft">
    <button class="ll" id="l50" title="去掉两个错误选项">去掉 2 个错项</button>
    <button class="ll" id="lt" title="加 10 秒">加 10 秒</button>
    <button class="ll" id="ls" title="换一题（不计入题数）">换一题</button>
  </div>
  <div class="flash" id="flash"></div>
  <div id="toast"></div>
  <div id="cele"></div>

  <div class="ov on" id="start">
    <h1>一站到底 · <em id="ttlEm">生物专场</em></h1>
    <div class="modes" id="modes">
      <button class="mode on" type="button" data-mode="bio">&#129516; 生物专场</button>
      <button class="mode" type="button" data-mode="phil">&#127963;&#65039; 哲学专场</button>
      <button class="mode" type="button" data-mode="mix">&#127922; 混合</button>
    </div>
    <ul class="rules">
      <li><b>答对继续</b>，答错或超时就<b>下台</b></li>
      <li>每题 <b>10 秒</b>，连续答对越多，得分倍率越高（最高 ×2）</li>
      <li>三次求助各限一次：去掉 2 个错项 / 加 10 秒 / 换一题；键盘 1 - 4 也能答题</li>
    </ul>
    <div id="bestLine" style="font-size:12px;color:var(--mute)"></div>
    <button class="go" id="goBtn">开始守擂</button>
  </div>

  <div class="ov" id="fb">
    <span class="tag" id="fbTag">答错了</span>
    <div class="ans" id="fbAns"></div>
    <div class="note" id="fbNote"></div>
    <button class="go" id="fbBtn">下台结算</button>
  </div>

  <div class="ov" id="over">
    <h2 id="ovTitle">已下台</h2>
    <div class="row">
      <div class="stat"><small>本次守擂</small><span id="ovN">0</span> 题</div>
      <div class="stat"><small>得分</small><span id="ovS">0</span></div>
      <div class="stat"><small>最高纪录</small><span id="ovB">0</span> 题</div>
    </div>
    <div id="ovNew" class="tag" style="display:none">新纪录！</div>
    <div class="cats" id="ovCats"></div>
    <button class="go o" id="againBtn">再战一次</button>
    <button class="go ghost" id="menuBtn" type="button">换专场</button>
  </div>
</div>

<script>
"use strict";
const CATS = ["细胞","遗传","生态","人体","动物","植物","微生物","进化","综合"];

const BANK = [
/* ---------- 细胞 / 生物化学 ---------- */
{q:"被称为细胞“能量工厂”的细胞器是？",opts:["线粒体","核糖体","高尔基体","溶酶体"],a:0,cat:"细胞",d:1,note:"线粒体是有氧呼吸的主要场所，产生大量 ATP。"},
{q:"正常人体的体细胞中有多少条染色体？",opts:["46 条","23 条","48 条","44 条"],a:0,cat:"细胞",d:1,note:"人体体细胞含 23 对共 46 条染色体。"},
{q:"细胞中合成蛋白质的场所是？",opts:["核糖体","叶绿体","液泡","中心体"],a:0,cat:"细胞",d:1,note:"核糖体是蛋白质的“生产车间”。"},
{q:"真核细胞的遗传物质主要储存在哪里？",opts:["细胞核","核糖体","高尔基体","溶酶体"],a:0,cat:"细胞",d:1,note:"DNA 主要位于细胞核的染色体上。"},
{q:"含有多种水解酶、被称为细胞“消化车间”的细胞器是？",opts:["溶酶体","线粒体","内质网","叶绿体"],a:0,cat:"细胞",d:2,note:"溶酶体能分解衰老细胞器和入侵的病菌。"},
{q:"植物细胞有、而动物细胞没有的结构是？",opts:["细胞壁","细胞膜","细胞核","线粒体"],a:0,cat:"细胞",d:1,note:"植物细胞外有纤维素构成的细胞壁。"},
{q:"细胞膜的基本骨架是？",opts:["磷脂双分子层","纤维素层","蛋白质单层","核酸链"],a:0,cat:"细胞",d:2,note:"磷脂双分子层构成膜的基本支架。"},
{q:"细胞进行有丝分裂后，子细胞的染色体数与母细胞相比？",opts:["相同","减半","加倍","不一定"],a:0,cat:"细胞",d:2,note:"有丝分裂保证子细胞遗传信息与母细胞一致。"},
{q:"原核细胞与真核细胞最主要的区别是？",opts:["有无成形的细胞核","有无细胞膜","有无核糖体","有无细胞质"],a:0,cat:"细胞",d:2,note:"原核细胞没有以核膜为界限的细胞核。"},
{q:"提出“细胞学说”的两位科学家是？",opts:["施莱登和施旺","沃森和克里克","孟德尔和摩尔根","达尔文和华莱士"],a:0,cat:"细胞",d:2,note:"细胞学说：细胞是生物体结构和功能的基本单位。"},
{q:"生物体生命活动的直接能源物质是？",opts:["ATP","葡萄糖","脂肪","淀粉"],a:0,cat:"细胞",d:2,note:"ATP 被称为细胞的“能量货币”。"},
{q:"由基因决定的细胞自动结束生命的过程叫？",opts:["细胞凋亡","细胞分化","细胞癌变","细胞融合"],a:0,cat:"细胞",d:3,note:"细胞凋亡是程序性死亡，对机体有利。"},
{q:"活细胞中含量最多的化合物是？",opts:["水","蛋白质","糖类","脂肪"],a:0,cat:"细胞",d:1,note:"活细胞中水占 60% 以上，是含量最多的化合物。"},
{q:"对蛋白质进行加工、分类和包装的细胞器是？",opts:["高尔基体","核糖体","中心体","叶绿体"],a:0,cat:"细胞",d:3,note:"高尔基体像细胞里的“快递分拣站”。"},
{q:"构成蛋白质的基本单位是？",opts:["氨基酸","核苷酸","葡萄糖","脂肪酸"],a:0,cat:"细胞",d:1,note:"氨基酸脱水缩合形成肽链，折叠成蛋白质。"},
{q:"绝大多数酶的化学本质是？",opts:["蛋白质","糖类","脂肪","无机盐"],a:0,cat:"细胞",d:2,note:"少数酶是 RNA，绝大多数是蛋白质。"},
{q:"淀粉被彻底水解后的产物是？",opts:["葡萄糖","氨基酸","甘油","脂肪酸"],a:0,cat:"细胞",d:2,note:"淀粉由许多葡萄糖连接而成。"},
{q:"生物体生命活动的主要能源物质是？",opts:["糖类","蛋白质","核酸","维生素"],a:0,cat:"细胞",d:2,note:"糖类是主要能源，脂肪是主要储能物质。"},
{q:"DNA 的基本组成单位是？",opts:["脱氧核苷酸","核糖核苷酸","氨基酸","葡萄糖"],a:0,cat:"细胞",d:3,note:"DNA 由四种脱氧核苷酸连接而成。"},
{q:"水分子通过半透膜的渗透作用，总体方向是？",opts:["从低浓度溶液向高浓度溶液","从高浓度溶液向低浓度溶液","不发生移动","只向外流出"],a:0,cat:"细胞",d:3,note:"水从溶质少的一侧流向溶质多的一侧。"},
{q:"动物细胞有丝分裂中，与纺锤体形成有关的细胞器是？",opts:["中心体","线粒体","溶酶体","液泡"],a:0,cat:"细胞",d:3,note:"中心体发出星射线形成纺锤体。"},
{q:"有氧呼吸彻底分解葡萄糖，最终产物是？",opts:["二氧化碳和水","酒精和二氧化碳","乳酸","氧气和水"],a:0,cat:"细胞",d:2,note:"有氧呼吸释放大量能量。"},
{q:"细胞膜在功能上的特性是？",opts:["选择透过性","绝对不透性","完全透过性","自由扩散"],a:0,cat:"细胞",d:2,note:"细胞膜能让需要的物质进出，阻挡有害物质。"},
{q:"最早用显微镜观察软木薄片并将所见小室命名为“细胞”的是？",opts:["罗伯特·胡克","列文虎克","孟德尔","巴斯德"],a:0,cat:"细胞",d:2,note:"1665 年胡克观察软木，命名 cell。"},
{q:"能分化成多种类型细胞的未分化细胞叫？",opts:["干细胞","癌细胞","神经元","红细胞"],a:0,cat:"细胞",d:2,note:"干细胞具有自我更新和多向分化能力。"},
{q:"癌细胞的显著特点是？",opts:["能无限增殖","不能分裂","寿命极短","不含 DNA"],a:0,cat:"细胞",d:2,note:"癌细胞失去控制，无限增殖并易扩散。"},
{q:"细胞周期中，DNA 复制发生在？",opts:["分裂间期","前期","中期","末期"],a:0,cat:"细胞",d:3,note:"间期完成 DNA 复制和蛋白质合成。"},
{q:"活细胞中，主要的储能物质是？",opts:["脂肪","核酸","无机盐","水"],a:0,cat:"细胞",d:3,note:"脂肪是细胞内良好的储能物质。"},
{q:"哺乳动物的成熟红细胞没有下列哪种结构？",opts:["细胞核","细胞膜","细胞质","血红蛋白"],a:0,cat:"细胞",d:3,note:"成熟红细胞无核，腾出空间多装血红蛋白。"},

/* ---------- 遗传 ---------- */
{q:"提出 DNA 双螺旋结构模型的科学家是？",opts:["沃森和克里克","孟德尔和摩尔根","达尔文和华莱士","巴斯德和科赫"],a:0,cat:"遗传",d:1,note:"1953 年沃森和克里克提出 DNA 双螺旋模型。"},
{q:"被誉为“遗传学之父”、用豌豆做杂交实验的是？",opts:["孟德尔","达尔文","摩尔根","林奈"],a:0,cat:"遗传",d:1,note:"孟德尔总结出分离定律和自由组合定律。"},
{q:"DNA 中，腺嘌呤（A）与哪种碱基配对？",opts:["胸腺嘧啶（T）","鸟嘌呤（G）","胞嘧啶（C）","尿嘧啶（U）"],a:0,cat:"遗传",d:2,note:"A 与 T 配对，G 与 C 配对。"},
{q:"RNA 中有、而 DNA 中没有的碱基是？",opts:["尿嘧啶（U）","胸腺嘧啶（T）","腺嘌呤（A）","胞嘧啶（C）"],a:0,cat:"遗传",d:2,note:"RNA 用 U 代替了 T。"},
{q:"人类男性的性染色体组成是？",opts:["XY","XX","YY","XO"],a:0,cat:"遗传",d:1,note:"男性 XY，女性 XX。"},
{q:"正常人的精子中有多少条染色体？",opts:["23 条","46 条","22 条","92 条"],a:0,cat:"遗传",d:1,note:"减数分裂使生殖细胞染色体数减半。"},
{q:"Aa × Aa 的杂交后代，显性性状与隐性性状的比约为？",opts:["3 : 1","1 : 1","1 : 2 : 1","9 : 1"],a:0,cat:"遗传",d:2,note:"孟德尔分离定律的经典比例 3 : 1。"},
{q:"红绿色盲的遗传方式是？",opts:["伴 X 染色体隐性遗传","常染色体隐性遗传","常染色体显性遗传","伴 Y 染色体遗传"],a:0,cat:"遗传",d:3,note:"因此男性患者多于女性。"},

/* ================= game ================= */
const $ = s => document.querySelector(s);
const LS = 'bioquiz_best_v1', LM = 'bioquiz_mute_v1', LMODE = 'bioquiz_mode_v1';
const CATS_PHIL = ["古希腊","中国古代","近代西方","德国古典","现代与当代","伦理学","认识论与形而上学","逻辑与科学哲学","东方其他"];
const ALLCATS = CATS.concat(CATS_PHIL);
const MODES = {bio:{name:'生物专场', pool:BANK}, phil:{name:'哲学专场', pool:BANK_PHIL}, mix:{name:'混合专场', pool:BANK.concat(BANK_PHIL)}};
let MODE = 'bio', POOL = BANK;
let best = {streak:0, score:0};
let muted = false;
function bestKey(){ return MODE === 'bio' ? LS : LS + '_' + MODE; }
function loadBest(){
  best = {streak:0, score:0};
  try { const b = JSON.parse(localStorage.getItem(bestKey()) || 'null'); if (b && typeof b.streak === 'number') best = b; } catch(e){}
}
try { muted = localStorage.getItem(LM) === '1'; } catch(e){}

/* ---- audio ---- */
let AC = null;
function ac(){
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
  }catch(e){ AC = null; }
  return AC;
}
function beep(f, t0, dur, type, vol, f2){
  if(muted) return;
  const c = ac(); if(!c) return;
  try{
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol || 0.14, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }catch(e){}
}
const sfx = {
  tick(){ beep(900, 0, 0.06, 'square', 0.07); },
  ok(){ beep(660, 0, 0.12, 'triangle', 0.16); beep(990, 0.1, 0.2, 'triangle', 0.16); },
  bad(){ beep(240, 0, 0.35, 'sawtooth', 0.12, 90); },
  ding(){ beep(1320, 0, 0.45, 'sine', 0.15); beep(1980, 0.02, 0.35, 'sine', 0.06); },
  fan(){ [523, 659, 784, 1047, 784, 1047, 1319].forEach((f,i)=>beep(f, i*0.11, 0.22, 'triangle', 0.15)); },
  tap(){ beep(500, 0, 0.05, 'sine', 0.08); }
};

/* ---- helpers ---- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function mult(streak){ return streak >= 20 ? 2.0 : streak >= 10 ? 1.5 : streak >= 5 ? 1.2 : 1.0; }
const CHIP_BG = {细胞:'var(--pink)',遗传:'var(--blue)',生态:'var(--green)',人体:'var(--orange)',动物:'var(--yellow)',植物:'var(--green)',微生物:'var(--blue)',进化:'var(--pink)',综合:'var(--stone)',古希腊:'var(--blue)',中国古代:'var(--orange)',近代西方:'var(--green)',德国古典:'var(--pink)',现代与当代:'var(--yellow)',伦理学:'var(--green)',认识论与形而上学:'var(--blue)',逻辑与科学哲学:'var(--pink)',东方其他:'var(--stone)'};
const el = {
  streak:$('#streak'), mult:$('#mult'), score:$('#score'), bar:$('#bar'), sec:$('#sec'), chip:$('#chip'), stars:$('#stars'),
  qn:$('#qn'), q:$('#q'), opts:$('#opts'), l50:$('#l50'), lt:$('#lt'), ls:$('#ls'), flash:$('#flash'), toast:$('#toast'),
  cele:$('#cele'), start:$('#start'), fb:$('#fb'), over:$('#over'), mute:$('#mute')
};

let S = null, timer = null, lastTs = 0, toastT = 0;

function newState(){
  return { n:0, score:0, streak:0, used:new Set(), lastCat:'', stats:{}, ll:{f:true,t:true,s:true},
           cur:null, active:false, t:10, tot:10, lastSec:0, reason:'' };
}

function pickD(){
  const n = S.n, r = Math.random();
  if(n < 5) return 1;
  if(n < 15) return r < .25 ? 1 : r < .85 ? 2 : 3;
  return r < .1 ? 1 : r < .4 ? 2 : 3;
}
function pickQ(){
  const want = pickD();
  const order = [want, ...[1,2,3].filter(x=>x!==want).sort((a,b)=>Math.abs(a-want)-Math.abs(b-want))];
  for(let pass=0; pass<2; pass++){
    for(const d of order){
      let pool = [];
      for(let i=0;i<POOL.length;i++) if(POOL[i].d===d && !S.used.has(i)) pool.push(i);
      if(!pool.length) continue;
      const diff = pool.filter(i=>POOL[i].cat !== S.lastCat);
      if(diff.length) pool = diff;
      return pool[Math.floor(Math.random()*pool.length)];
    }
    S.used.clear();
  }
  return 0;
}

function renderHud(){
  el.streak.textContent = '连对 ' + S.streak;
  const m = mult(S.streak);
  if(m > 1){ el.mult.style.display=''; el.mult.className='pill o'; el.mult.textContent='×' + m.toFixed(1); }
  else el.mult.style.display='none';
  el.score.textContent = S.score + ' 分';
  el.l50.disabled = !S.ll.f || !S.active;
  el.lt.disabled = !S.ll.t || !S.active;
  el.ls.disabled = !S.ll.s || !S.active;
}

function showQ(idx){
  S.used.add(idx);
  const it = POOL[idx];
  const opts = shuffle(it.opts.map((t,i)=>({t, ok:i===it.a})));
  S.cur = {idx, it, opts, btns:[]};
  S.lastCat = it.cat;
  el.chip.textContent = it.cat;
  el.chip.style.background = CHIP_BG[it.cat] || 'var(--stone)';
  el.stars.textContent = '★'.repeat(it.d) + '☆'.repeat(3 - it.d);
  el.qn.textContent = '第 ' + (S.n + 1) + ' 题';
  el.q.textContent = it.q;
  el.opts.innerHTML = '';
  opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.type = 'button';
    const k = document.createElement('b'); k.textContent = i + 1;
    const s = document.createElement('span'); s.textContent = o.t;
    b.append(k, s);
    b.addEventListener('click', () => answer(i));
    el.opts.appendChild(b);
    S.cur.btns.push(b);
  });
  S.active = true; S.t = 10; S.tot = 10; S.lastSec = 0;
  updTimer();
  renderHud();
  startTimer();
}

function nextQ(){ showQ(pickQ()); }

function updTimer(){
  const p = Math.max(0, S.t / S.tot);
  el.bar.style.width = (p * 100) + '%';
  el.bar.className = S.t <= 3 ? 'low' : S.t <= 6 ? 'mid' : '';
  el.sec.textContent = Math.max(0, Math.ceil(S.t));
  el.sec.className = S.t <= 3 ? 'low' : '';
}
function startTimer(){
  stopTimer();
  lastTs = performance.now();
  timer = setInterval(() => {
    const now = performance.now();
    const dt = Math.min(now - lastTs, 250) / 1000;
    lastTs = now;
    if(!S || !S.active) return;
    S.t -= dt;
    const sec = Math.ceil(S.t);
    if(sec <= 3 && sec > 0 && sec !== S.lastSec){ S.lastSec = sec; sfx.tick(); }
    if(S.t <= 0){ S.t = 0; updTimer(); finish(-1); return; }
    updTimer();
  }, 80);
}
function stopTimer(){ if(timer){ clearInterval(timer); timer = null; } }

function flash(kind){
  el.flash.className = 'flash'; void el.flash.offsetWidth; el.flash.className = 'flash ' + kind;
}
function toast(msg){
  el.toast.textContent = msg; el.toast.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.toast.classList.remove('on'), 1500);
}
function celebrate(n){
  el.cele.innerHTML = '';
  const t = document.createElement('div'); t.className = 't'; t.textContent = '守擂成功！';
  const s = document.createElement('div'); s.className = 's'; s.textContent = '【叮！】连续答对 ' + n + ' 题';
  el.cele.append(t, s);
  const cols = ['#FAE36B','#EF6A2F','#9BC5A3','#9FB7E0','#F2B5C4'];
  for(let i=0;i<36;i++){
    const c = document.createElement('i');
    c.style.left = Math.random()*100 + '%';
    c.style.background = cols[i % cols.length];
    c.style.animationDuration = (1 + Math.random()*0.9) + 's';
    c.style.animationDelay = (Math.random()*0.35) + 's';
    el.cele.appendChild(c);
  }
  el.cele.className = ''; void el.cele.offsetWidth; el.cele.className = 'on';
  setTimeout(() => { el.cele.className = ''; }, 1500);
}

function record(cat, ok){
  const s = S.stats[cat] || (S.stats[cat] = {c:0, t:0});
  s.t++; if(ok) s.c++;
}

function answer(i){
  if(!S || !S.active) return;
  sfx.tap();
  const o = S.cur.opts[i];
  if(o.ok) finish(i); else finish(i);
}

function finish(i){
  if(!S.active) return;
  S.active = false; stopTimer();
  const cur = S.cur, it = cur.it;
  const correctIdx = cur.opts.findIndex(o => o.ok);
  cur.btns.forEach(b => b.disabled = true);
  const ok = i >= 0 && cur.opts[i].ok;
  record(it.cat, ok);
  if(ok){
    const gain = Math.round(100 * it.d * mult(S.streak));
    S.score += gain;
    S.streak++; S.n++;
    cur.btns[i].classList.add('ok');
    flash('g'); sfx.ok();
    renderHud();
    const big = S.streak % 10 === 0;
    let delay = 650;
    if(big){ delay = 1500; setTimeout(() => { sfx.fan(); celebrate(S.streak); }, 250); }
    else if(S.streak % 5 === 0){ setTimeout(() => { sfx.ding(); toast('【叮！】守擂 ' + S.streak + ' 题！'); }, 200); }
    setTimeout(() => { if(S && !S.active && S.cur === cur) nextQ(); }, delay);
  } else {
    if(i >= 0) cur.btns[i].classList.add('bad');
    cur.btns[correctIdx].classList.add('ok');
    flash('r'); sfx.bad();
    S.reason = i < 0 ? '时间到' : '答错了';
    renderHud();
    setTimeout(showFb, 1100);
  }
}

function showFb(){
  const it = S.cur.it;
  $('#fbTag').textContent = S.reason;
  $('#fbAns').textContent = '正确答案：' + it.opts[it.a];
  const n = $('#fbNote'); n.innerHTML = '';
  const b = document.createElement('b'); b.textContent = '冷知识　';
  n.append(b, document.createTextNode(it.note));
  el.fb.classList.add('on');
  $('#fbBtn').focus({preventScroll:true});
}

function showOver(){
  el.fb.classList.remove('on');
  el.toast.classList.remove('on'); el.cele.className='';
  const nw = S.streak > best.streak || (S.streak === best.streak && S.score > best.score && S.streak > 0);
  const prevBest = best.streak;
  if(S.streak > best.streak) best.streak = S.streak;
  if(S.score > best.score) best.score = S.score;
  try{ localStorage.setItem(bestKey(), JSON.stringify(best)); }catch(e){}
  $('#ovTitle').textContent = S.reason === '时间到' ? '时间到，已下台' : '答错了，已下台';
  $('#ovN').textContent = S.streak;
  $('#ovS').textContent = S.score;
  $('#ovB').textContent = best.streak;
  $('#ovNew').style.display = (S.streak > prevBest && S.streak > 0) ? '' : 'none';
  const box = $('#ovCats'); box.innerHTML = '';
  ALLCATS.forEach(c => {
    const s = S.stats[c]; if(!s) return;
    const chip = document.createElement('span'); chip.className = 'chip';
    chip.style.background = CHIP_BG[c];
    chip.textContent = c + ' ' + s.c + '/' + s.t + ' · ' + Math.round(s.c / s.t * 100) + '%';
    box.appendChild(chip);
  });
  if(!box.children.length) box.textContent = '';
  el.over.classList.add('on');
  $('#againBtn').focus({preventScroll:true});
}

function startGame(){
  ac();
  POOL = MODES[MODE].pool;
  S = newState();
  el.start.classList.remove('on'); el.over.classList.remove('on'); el.fb.classList.remove('on');
  el.cele.className = '';
  el.toast.classList.remove('on');
  nextQ();
  $('#app').focus({preventScroll:true});
}

/* ---- lifelines ---- */
el.l50.addEventListener('click', () => {
  if(!S || !S.active || !S.ll.f) return;
  S.ll.f = false; sfx.tap();
  const wrong = S.cur.opts.map((o,i)=>i).filter(i => !S.cur.opts[i].ok);
  shuffle(wrong).slice(0,2).forEach(i => S.cur.btns[i].classList.add('gone'));
  renderHud();
});
el.lt.addEventListener('click', () => {
  if(!S || !S.active || !S.ll.t) return;
  S.ll.t = false; sfx.tap();
  S.t += 10; S.tot = Math.max(10, S.t); S.lastSec = 0;
  updTimer(); renderHud(); toast('+10 秒');
});
el.ls.addEventListener('click', () => {
  if(!S || !S.active || !S.ll.s) return;
  S.ll.s = false; sfx.tap(); S.active = false; stopTimer();
  nextQ();
});

/* ---- buttons / keyboard ---- */
$('#goBtn').addEventListener('click', startGame);
$('#againBtn').addEventListener('click', startGame);
$('#fbBtn').addEventListener('click', showOver);
function syncMute(){ el.mute.innerHTML = muted ? '&#128263;' : '&#128266;'; el.mute.title = muted ? '已静音' : '声音开'; }
el.mute.addEventListener('click', () => {
  muted = !muted; syncMute();
  try{ localStorage.setItem(LM, muted ? '1' : '0'); }catch(e){}
  if(!muted){ ac(); sfx.tap(); }
});
syncMute();
document.addEventListener('keydown', e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(S && S.active && e.key >= '1' && e.key <= '4'){ e.preventDefault(); answer(+e.key - 1); return; }
  if(e.key === 'Enter' || e.key === ' '){
    if(e.target && e.target.tagName === 'BUTTON') return;
    if(el.over.classList.contains('on')){ e.preventDefault(); startGame(); }
    else if(el.fb.classList.contains('on')){ e.preventDefault(); showOver(); }
    else if(el.start.classList.contains('on')){ e.preventDefault(); startGame(); }
  }
});
$('#app').addEventListener('pointerdown', () => { try{ $('#app').focus({preventScroll:true}); }catch(e){} });

/* ---- mode picker ---- */
function setMode(m, persist){
  if(!MODES[m]) m = 'bio';
  MODE = m; POOL = MODES[m].pool;
  document.querySelectorAll('.mode').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  $('#ttlEm').textContent = MODES[m].name;
  document.title = '一站到底 · ' + MODES[m].name;
  loadBest();
  $('#bestLine').textContent = best.streak > 0 ? ('最高纪录：连对 ' + best.streak + ' 题 · 最高得分 ' + best.score) : '题库 ' + POOL.length + ' 题，来挑战你的底子';
  if(persist){ try{ localStorage.setItem(LMODE, m); }catch(e){} }
}
document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => { sfx.tap(); setMode(b.dataset.mode, true); }));
$('#menuBtn').addEventListener('click', () => { el.over.classList.remove('on'); el.start.classList.add('on'); $('#goBtn').focus({preventScroll:true}); });
(function(){ let m = 'bio'; try{ m = localStorage.getItem(LMODE) || 'bio'; }catch(e){} setMode(m, false); })();
</script>
