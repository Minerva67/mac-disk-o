<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我在 Mac 磁盘里当清洁工，系统让我删掉 5000 万只怪物</title>
<style>
:root{--paper:#FBF8F1;--ink:#151716;--yellow:#FAE36B;--orange:#EF6A2F;--stone:#E3DFD5;--mute:#6B6A66;--green:#9BC5A3;--blue:#9FB7E0;--pink:#F2B5C4;
--bg:#FBF8F1;--fg:#151716;--card:#fff;--line:#E3DFD5;--sysbg:#151716;--font:'Outfit','DM Sans',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#151716;--fg:#FBF8F1;--card:#1f2321;--line:#33372f;--mute:#a3a29c;--sysbg:#0a0b0b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none}
.hidden{display:none!important}
#app{position:relative;height:100%;min-height:400px;overflow:hidden}
#top{position:absolute;left:0;right:0;top:0;height:36px;display:flex;align-items:center;gap:6px;padding:0 10px;z-index:5}
#ttl{flex:1;min-width:0;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--yellow);color:#151716;white-space:nowrap}
.chip.off{background:var(--pink)}
.ib{border:2px solid var(--fg);background:transparent;color:var(--fg);border-radius:999px;width:28px;height:26px;font-size:13px;cursor:pointer;padding:0;line-height:1}
.btn{font-family:inherit;font-weight:700;font-size:14px;border:2px solid #151716;background:var(--yellow);color:#151716;border-radius:999px;padding:8px 14px;cursor:pointer;box-shadow:0 2px 0 #151716;touch-action:none;transition:transform .05s}
.btn:active,.btn.on{transform:translateY(2px);box-shadow:0 0 0 #151716}
.btn.o{background:var(--orange);color:#fff}.btn.g{background:var(--card);color:var(--fg);border-color:var(--fg);box-shadow:0 2px 0 var(--fg)}
.btn.mini{font-size:11px;padding:2px 10px;box-shadow:none}
.btn[disabled]{opacity:.4}
#menu{position:absolute;top:36px;left:0;right:0;bottom:0;overflow-y:auto;padding:2px 10px 14px}
#sys{background:var(--sysbg);color:var(--yellow);border-radius:18px;padding:10px 14px;margin-bottom:10px;border:1.5px solid var(--line);cursor:pointer}
.sysh{font-size:11px;color:var(--orange);font-weight:700;letter-spacing:.08em;margin-bottom:4px}
#sysT{white-space:pre-wrap;font-size:12.5px;line-height:1.6;min-height:20px}
#sysS{font-size:11px;color:#c9b94f;margin-top:6px;opacity:.85}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;min-height:96px}
.card h4{margin:0;font-size:14px;display:flex;align-items:center;gap:6px}
.card .no{background:var(--ink);color:var(--yellow);border-radius:999px;font-size:11px;padding:0 7px}
.card p{margin:0;font-size:11.5px;color:var(--mute);line-height:1.45}
.card.lock{background:transparent;border-style:dashed}
.card.lock p b{color:var(--orange)}
.card .btn{align-self:flex-start;margin-top:auto;font-size:12px;padding:4px 14px}
.card .done{color:var(--green);font-size:11px;font-weight:700}
.mbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:2px}.mbar i{display:block;height:100%;background:var(--orange)}
#stage{position:absolute;top:36px;left:0;right:0;bottom:0;display:flex;flex-direction:column}
#cvw{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:18px;margin:0 6px}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:absolute;left:8px;right:8px;top:6px;display:flex;gap:5px;flex-wrap:wrap;pointer-events:none}
#hud .c{background:rgba(21,23,22,.78);color:#FBF8F1;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;white-space:nowrap}
#hud .bar{display:inline-block;width:52px;height:6px;border-radius:3px;background:#555;vertical-align:middle;margin-left:5px;overflow:hidden}
#hud .bar i{display:block;height:100%}
#cnt{position:absolute;right:8px;top:34px;font-family:inherit;border:0;border-radius:999px;background:rgba(251,248,241,.14);color:#cfcdc6;font-size:10px;padding:2px 9px;cursor:pointer}
#dlg{position:absolute;left:8px;right:8px;bottom:8px;border-radius:18px;padding:10px 14px 8px;cursor:pointer;border:2px solid var(--ink);z-index:3}
#dlg.sys{background:#151716;color:var(--yellow)}
#dlg.dino{background:var(--paper);color:var(--ink)}
#dlg.bot{background:#dfe8f7;color:var(--ink)}#dlg.light{background:#fff7c9;color:var(--ink)}#dlg.boss{background:#fbd9c9;color:var(--ink)}
#dname{font-size:11px;font-weight:700;opacity:.75;margin-bottom:2px}
#dtext{font-size:13.5px;line-height:1.55;min-height:42px;white-space:pre-wrap}
#dfoot{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;opacity:.7;margin-top:2px}
#dlg .btn.mini{background:transparent;color:inherit;border-color:currentColor}
#res{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,360px);background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:18px;padding:14px 16px;text-align:center;z-index:4;box-shadow:0 4px 0 var(--ink)}
#res.top{top:8px;transform:translate(-50%,0)}
#res h3{margin:0 0 6px;font-size:16px}#res p{margin:4px 0 10px;font-size:13px;line-height:1.55}
#res .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#res .big{font-size:30px;font-weight:800;color:var(--orange);margin:2px 0}
#ctl{height:50px;display:flex;gap:6px;padding:6px 8px 4px;align-items:center}
#ctl .btn{padding:6px 10px;font-size:14px;line-height:1.1}
#bJ{flex:1.5}#bF{flex:1.2}
#toasts{position:absolute;left:0;right:0;top:40px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:20}
.toast{background:#151716;color:var(--yellow);border:2px solid var(--yellow);border-radius:18px;padding:7px 14px;font-size:12.5px;font-weight:600;max-width:92%;animation:tin .3s ease-out;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.toast.out{opacity:0;transform:translateY(-10px);transition:all .4s}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.95)}to{opacity:1;transform:none}}
#book{position:absolute;inset:0;background:rgba(21,23,22,.55);z-index:15;display:flex;align-items:center;justify-content:center;padding:10px}
#paper{width:min(100%,380px);max-height:100%;overflow-y:auto;background:#FBF8F1 repeating-linear-gradient(transparent 0 25px,#e3dfd5 25px 26px);color:#151716;border-radius:18px;padding:12px 16px 12px 22px;border:2px solid #151716;border-left:10px solid var(--orange)}
#paper h3{margin:0 0 6px;font-size:15px}
#paper .r{font-size:13px;line-height:26px;position:relative}
#paper .r.lk{color:#9a988f}#paper .r s{color:#777;text-decoration-color:var(--orange);text-decoration-thickness:2px}
#paper .r em{font-style:normal;font-size:10.5px;background:var(--orange);color:#fff;border-radius:999px;padding:0 7px;margin-left:4px}
#paper .r.new{background:rgba(250,227,107,.55);border-radius:6px;animation:pl 1s infinite alternate}
@keyframes pl{to{background:rgba(250,227,107,.2)}}
#paper .ft{display:flex;justify-content:flex-end;margin-top:6px}
#focus{position:absolute;inset:0;z-index:30;background:rgba(21,23,22,.82);display:flex;align-items:center;justify-content:center;text-align:center;color:#FBF8F1;cursor:pointer;padding:16px}
#focus b{display:block;font-size:22px;color:var(--yellow);margin-bottom:6px}#focus small{font-size:12px;opacity:.8;line-height:1.7}
#focus .t{font-size:13px;font-weight:700;margin-bottom:10px;color:#FBF8F1}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="ttl">《我在 Mac 磁盘里当清洁工，系统让我删掉 5000 万只怪物》</div>
    <span class="chip off hidden" id="offl">离线模式</span>
    <span class="chip hidden" id="devc">DEV</span>
    <span class="chip" id="pp">清理 0%</span>
    <button class="ib" id="bBook" title="守则">📓</button>
    <button class="ib" id="bMute" title="静音">🔊</button>
  </div>
  <div id="menu">
    <div id="sys"><div class="sysh">▌磁盘清理系统 · 在线</div><div id="sysT"></div><div id="sysS"></div></div>
    <div id="cards"></div>
  </div>
  <div id="stage" class="hidden">
    <div id="cvw">
      <canvas id="cv"></canvas>
      <div id="hud"></div>
      <button id="cnt" class="hidden"></button>
      <div id="dlg" class="hidden"><div id="dname"></div><div id="dtext"></div><div id="dfoot"><span>点一下继续 ▸ · 按住跳过</span><button class="btn mini" id="dskip">跳过 ›</button></div></div>
      <div id="res" class="hidden"></div>
    </div>
    <div id="ctl">
      <button class="btn g" id="bExit">‹ 目录</button>
      <button class="btn g" id="bL">◀</button>
      <button class="btn g" id="bR">▶</button>
      <button class="btn" id="bJ">跳 ↑</button>
      <button class="btn o" id="bF">🔥 喷火</button>
    </div>
  </div>
  <div id="toasts"></div>
  <div id="book" class="hidden"><div id="paper"></div></div>
  <div id="focus"><div><div class="t">《我在 Mac 磁盘里当清洁工，系统让我删掉 5000 万只怪物》</div><b>点一下开始</b><small>空格 / ↑ 或点屏幕 = 跳　F 或 🔥 = 喷火<br>故事进度由现实世界的清理进度解锁</small></div></div>
</div>
<script>
'use strict';
/* ============ 基础 ============ */
const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const DEV=/[?&]dev\b/.test(location.search);
const SAVE_KEY='knock_story_v1';
let save={done:[],rules:[],choice:null,notified:[],seenIntro:false,counter:false,muted:false};
try{Object.assign(save,JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'));}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}
const fmt=n=>Math.round(n).toLocaleString('en-US');
const WHO={sys:'系统',dino:'小恐龙',bot:'老机器人 deleted_helper',light:'Spotlight 灯塔',boss:'复制怪'};
const RULES=['看到长着同一张脸的 PNG 时，不要数它们有几只。','守门的老机器人睡着了。它醒来时说的任何话都不要相信。','Spotlight 灯塔的光扫到你时，请立刻报出你的文件名。你没有文件名。','如果听到“已删除”的提示音，可以放心前进。','王座上坐着的不是怪物，是写出这个脚本的人留下的第一张截图。'];

const CH=[
{n:1,need:0,name:'/tmp 洞穴',blurb:'教程 · 跳过迎面而来的 PNG',
 intro:[['sys','【叮！新手任务触发：穿过 /tmp 洞穴。奖励：活着。】'],['dino','……我只是一只小恐龙，为什么要绑定磁盘？'],['sys','【前方有大量 PNG 迎面而来。点屏幕或按空格跳跃。右上角有个计数器，千万别——算了，当我没说。】']],
 outro:()=>[['dino','它们……好像长得都一样？'],['sys','【叮！第 1 章完成。《磁盘求生守则》第 1 条已记入小本本。】']]},
{n:2,need:.35,name:'待清理区废墟',blurb:'火焰解锁 · 烧掉 30 只',
 intro:[['sys','【叮！检测到宿主体内沉睡的火焰。技能「磁盘清洁喷火」已解锁。】'],['dino','喷火？终于有点恐龙的样子了。'],['sys','【请烧毁 30 只 PNG。按住 F 或 🔥。它们叫起来像人，属于正常现象。】']],
 outro:()=>[['dino','它们刚才……是不是喊了「别删我」？'],['sys','【叮！这是正常的音效。第 2 章完成，守则第 2 条已记录。】']]},
{n:3,need:.5,name:'沉睡的守门人',blurb:'别吵醒它 · 悄悄走过去',
 intro:[['sys','【前方据点守门人：deleted_helper（已退役）。请查阅守则第 2 条。】'],['bot','Zzz……已……删……除……Zzz……'],['dino','它睡着了。我该怎么办？'],['sys','【跳跃和喷火都有噪音。按住 → 慢慢走，别吵醒它。】']],
 outro:L=>L&&L.woke?[['dino','它刚才说「可以放心前进」……幸好我没信。'],['sys','【叮！第 3 章完成，守则第 3 条已记录。】']]:[['dino','好险，没吵醒它。'],['sys','【叮！第 3 章完成，守则第 3 条已记录。】']]},
{n:4,need:.7,name:'Spotlight 灯塔',blurb:'躲进箱子后面 · 别被光扫到',
 intro:[['sys','【前方 Spotlight 灯塔，负责索引一切文件。】'],['light','【……扫描中……扫描中……】'],['dino','它在找什么？'],['sys','【躲在箱子后面，按 ←/→ 移动。守则第 3 条仅供参考。】']],
 outro:()=>[['light','【未索引到目标。】（……你真的没有名字吗？）'],['sys','【叮！已删除。……等等，这个提示音不是我发的。守则第 4 条已记录。】']]},
{n:5,need:.9,name:'ln_png 王座',blurb:'复制怪 · 越打越多',
 intro:[['sys','【终点：ln_png 王座。最终 Boss：复制怪。】'],['boss','每打我一下，我就多出几个。这是我的特色。'],['dino','那我不打你可以吗？'],['sys','【不可以。按 ←/→ 移动，按住 🔥 烧它们。】']],
 outro:()=>[['dino','这是……一张截图？'],['sys','【叮！第 5 章完成。守则第 5 条已记录。……你不该看到这个。】']]}
];
const ENDING=[['sys','【叮！主线任务完成：已清除 5000 万只 PNG。】'],['dino','终于结束了……所以那个失控的脚本，到底是谁写的？'],['sys','【……是我。】'],['sys','【每多一只 PNG，我的任务积分就多一点。系统也有 KPI。】'],['dino','那第五条守则里的那张截图——'],['sys','【当时它只有一张。后来我就忘了停。】']];
const SYS_INTRO=['【叮！检测到宿主：一只普通的小恐龙。绑定“磁盘清理系统”成功。】','【主线任务：清除 /tmp 洞穴中的 5000 万只 PNG。任务奖励：Mac 重获 250G 空间。】','【温馨提示：请严格遵守《磁盘求生守则》，违者后果自负。】'];

/* ============ 真实数据 ============ */
const R={deleted:0,start:53015330,floor:2500000,availKB:0,startKB:0,rate:0,eta:0,offline:false,hasProcs:false,hasDel:true,prog:0,gb:0,lastMil:null,fakeP:0,first:true};
function applyStats(j){
  R.deleted=+j.deleted||0;R.start=+j.start_total||R.start;R.floor=+j.floor||R.floor;
  R.availKB=+j.avail_kb||0;const h=j.history&&j.history[0];R.startKB=h&&h[2]!=null?+h[2]:R.availKB;
  R.rate=+j.rate_1m||0;R.eta=+j.eta_s||0;
  if(j.procs){const arr=Array.isArray(j.procs)?j.procs:Object.values(j.procs);R.hasProcs=true;
    R.hasDel=arr.some(p=>String(p&&typeof p==='object'?(p.name||p.cmd||JSON.stringify(p)):p).includes('删除'));}
  else R.hasProcs=false;
  derive();
}
function derive(){R.prog=clamp(R.deleted/Math.max(1,R.start-R.floor),0,1);R.gb=Math.max(0,(R.availKB-R.startKB)/1048576);}
function fakeStats(){
  R.offline=true;R.fakeP=Math.min(1,R.fakeP+0.008);
  R.deleted=R.fakeP*(R.start-R.floor);R.availKB=R.startKB+R.fakeP*250*1048576;R.eta=(1-R.fakeP)/0.008*5;R.hasProcs=false;derive();
}
const endReady=()=>DEV||R.prog>=.99||(R.hasProcs&&!R.hasDel&&R.deleted>0&&R.prog>.5);
const unlocked=c=>DEV||R.prog>=c.need-1e-9;
async function poll(){
  let ok=false;
  try{const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),3500);
    const r=await fetch('/stats',{cache:'no-store',signal:ac.signal});clearTimeout(tm);
    if(!r.ok)throw 0;applyStats(await r.json());R.offline=false;ok=true;}catch(e){}
  if(!ok)fakeStats();
  afterPoll();
}
function afterPoll(){
  const m=Math.floor(R.deleted/1e6);
  if(R.lastMil!==null&&m>R.lastMil)toast('叮！宿主已清除 '+fmt(R.deleted/1e4)+' 万只 PNG，奖励空间 +'+R.gb.toFixed(1)+'G');
  R.lastMil=m;
  CH.forEach(c=>{if(c.need>0&&R.prog>=c.need&&!save.notified.includes(c.n)){save.notified.push(c.n);persist();toast('叮！第 '+c.n+' 章「'+c.name+'」已解锁');}});
  if(endReady()&&!save.notified.includes(6)){save.notified.push(6);persist();toast('叮！终章已解锁：系统有话要对你说');}
  $('#offl').classList.toggle('hidden',!R.offline);
  $('#pp').textContent='清理 '+(R.prog*100).toFixed(1)+'%';
  if(state==='menu')renderMenu();
}

/* ============ 声音 ============ */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,v,f2,t0){if(save.muted)return;const a=ac();if(!a)return;const t=a.currentTime+(t0||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}
const sfx={
  jump(){tone(380,.12,'square',.06,820);},
  chime(){tone(1320,.2,'sine',.13);tone(1760,.4,'sine',.13,null,.13);},
  tick(){tone(1100,.03,'square',.02);},
  hit(){tone(180,.18,'sawtooth',.09,60);},
  pop(){tone(520,.08,'triangle',.07,240);},
  fire(){if(save.muted)return;const a=ac();if(!a)return;const t=a.currentTime,n=Math.floor(a.sampleRate*.4),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(2600,t+.4);
    const g=a.createGain();g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);},
  scream(){if(save.muted)return;const a=ac();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain(),l=a.createOscillator(),lg=a.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(950+rnd(-80,80),t);o.frequency.exponentialRampToValueAtTime(170,t+.42);l.frequency.value=22;lg.gain.value=45;l.connect(lg);lg.connect(o.frequency);
    g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+.45);o.connect(g);g.connect(a.destination);o.start(t);l.start(t);o.stop(t+.47);l.stop(t+.47);}
};

/* ============ 提示 / 笔记本 ============ */
const tq=[];let tbusy=false;
function toast(msg){tq.push(msg);if(!tbusy)nextToast();}
function nextToast(){const m=tq.shift();if(!m){tbusy=false;return;}tbusy=true;const d=document.createElement('div');d.className='toast';d.textContent=m;$('#toasts').appendChild(d);sfx.chime();
  setTimeout(()=>d.classList.add('out'),3000);setTimeout(()=>{d.remove();nextToast();},3500);}
function openBook(newIdx,cb){
  let h='<h3>📓 《磁盘求生守则》</h3>';
  RULES.forEach((r,i)=>{const has=save.rules.includes(i+1);
    if(!has)h+='<div class="r lk">'+(i+1)+'. ？？？（尚未发现）</div>';

const PAL=[null,
 {top:'#171a19',bot:'#2a2f2c',ground:'#3a403c',line:'#59625b',deco:'#222725'},
 {top:'#1d1a24',bot:'#35293f',ground:'#443853',line:'#6a5a80',deco:'#2a2233'},

 {top:'#0b1020',bot:'#1b2742',ground:'#25324f',line:'#4a5c85',deco:'#141c33'},
 {top:'#241212',bot:'#4a2420',ground:'#5a2e28',line:'#8a4a3c',deco:'#321817'}];
const hash=k=>{const s=Math.sin(k*127.1)*43758.5453;return s-Math.floor(s);};
function rep(sp,par,cam,fn){const off=cam*par,k0=Math.floor(off/sp)-1,n=Math.ceil(W/sp)+3;for(let i=0;i<n;i++){const k=k0+i;fn(k*sp-off,k);}}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
function drawBG(ch,cam,t){
  const p=PAL[ch];cx.fillStyle=p.top;cx.fillRect(-5,-OY/S-5,W+10,OY/S+5);
  const g=cx.createLinearGradient(0,0,0,GY);g.addColorStop(0,p.top);g.addColorStop(1,p.bot);cx.fillStyle=g;cx.fillRect(-5,-2,W+10,GY+2);
  cx.fillStyle=p.deco;
  if(ch===1){rep(52,.3,cam,(x,k)=>{const h=16+hash(k)*34;cx.beginPath();cx.moveTo(x,0);cx.lineTo(x+36,0);cx.lineTo(x+18,h);cx.fill();});
    rep(170,.7,cam,(x,k)=>{if(hash(k+5)<.4)return;cx.fillStyle='#394039';cx.fillRect(x-1.5,GY-12,3,12);cx.fillStyle='#9FB7E0';cx.beginPath();cx.arc(x,GY-13,6,Math.PI,0);cx.fill();cx.fillStyle=p.deco;});}
  if(ch===2){rep(220,.35,cam,(x,k)=>{const w=26+hash(k)*20,h=60+hash(k+3)*80;cx.fillRect(x,GY-h,w,h);cx.beginPath();cx.moveTo(x,GY-h);cx.lineTo(x+w*.4,GY-h-12);cx.lineTo(x+w*.7,GY-h+4);cx.lineTo(x+w,GY-h-6);cx.lineTo(x+w,GY-h);cx.fill();});
    rep(310,.6,cam,(x,k)=>{cx.fillStyle='#F2B5C4';cx.globalAlpha=.5;cx.font='700 10px sans-serif';cx.textAlign='center';cx.fillText('待清理',x,GY-70-hash(k)*30);cx.globalAlpha=1;cx.fillStyle=p.deco;});}
  if(ch===3){rep(150,.4,cam,(x,k)=>{cx.fillStyle=p.deco;cx.fillRect(x,GY-96,44,96);for(let r=0;r<5;r++){const on=Math.sin(t*3+k*2+r*1.7)>0;cx.fillStyle=on?'#9BC5A3':'#F2B5C4';cx.globalAlpha=on?.9:.35;cx.fillRect(x+6,GY-88+r*17,6,4);cx.fillRect(x+16,GY-88+r*17,22,4);cx.globalAlpha=1;}});
    cx.strokeStyle='#0c1818';cx.lineWidth=3;rep(97,.2,cam,(x,k)=>{cx.beginPath();cx.moveTo(x,0);cx.quadraticCurveTo(x+30,30+hash(k)*50,x+70,0);cx.stroke();});}
  if(ch===4){cx.fillStyle='#fff';for(let k=0;k<50;k++){const x=hash(k)*W,y=hash(k+99)*(GY-70);cx.globalAlpha=.4+.5*Math.abs(Math.sin(t*1.5+k));cx.fillRect(x,y,1.6,1.6);}cx.globalAlpha=1;
    cx.fillStyle='#FBF8F1';cx.beginPath();cx.arc(W*.18,44,15,0,7);cx.fill();cx.fillStyle=p.top;cx.beginPath();cx.arc(W*.18+6,40,13,0,7);cx.fill();
    cx.fillStyle=p.deco;rep(200,.2,cam,(x,k)=>{const h=40+hash(k)*40;cx.beginPath();cx.moveTo(x-60,GY);cx.quadraticCurveTo(x+40,GY-h*2,x+140,GY);cx.fill();});}
  if(ch===5){const rg=cx.createRadialGradient(W*.75,GY-40,10,W*.75,GY-40,W*.5);rg.addColorStop(0,'rgba(239,106,47,.35)');rg.addColorStop(1,'rgba(239,106,47,0)');cx.fillStyle=rg;cx.fillRect(0,0,W,GY);
    cx.fillStyle=p.deco;rep(160,.3,cam,(x,k)=>{cx.fillRect(x,GY-130,22,130);cx.beginPath();cx.arc(x+11,GY-130,11,Math.PI,0);cx.fill();});}
  cx.fillStyle=p.ground;cx.fillRect(-5,GY,W+10,H-GY+6);cx.fillStyle=p.line;cx.fillRect(-5,GY,W+10,3);
  for(let x=-(cam%60);x<W;x+=60){cx.fillRect(x,GY+14,22,3);cx.fillRect(x+30,GY+30,14,3);}
}

/* ============ 角色绘制 ============ */
function drawDino(x,y,f,t,o){
  o=o||{};cx.save();cx.translate(x,y);if(o.inv&&Math.floor(t*14)%2)cx.globalAlpha=.4;
  cx.lineWidth=2;cx.strokeStyle='#151716';cx.lineJoin='round';
  const bob=o.on===false?0:Math.abs(Math.sin(t*(o.walk?14:3)))*(o.walk?2.5:1);cx.translate(0,-bob);
  cx.fillStyle='#EF6A2F';for(let k=0;k<3;k++){const th=-Math.PI/2-f*(k*.5+.15),c=Math.cos(th),s=Math.sin(th),px=-s*.26,py=c*.26;
    cx.beginPath();cx.moveTo(c*13+(-s)*5,-15+s*13+c*5);cx.lineTo(c*23,-15+s*23);cx.lineTo(c*13+s*5,-15+s*13-c*5);cx.closePath();cx.fill();cx.stroke();}
  cx.fillStyle='#FAE36B';cx.beginPath();cx.moveTo(-f*12,-8);cx.lineTo(-f*24,-3);cx.lineTo(-f*11,-1);cx.fill();cx.stroke();
  const a=Math.sin(t*14)*3,fw=o.on===false?0:1;cx.fillStyle='#FAE36B';
  cx.beginPath();cx.ellipse(-5+a*fw,bob,5,3.2,0,0,7);cx.fill();cx.stroke();cx.beginPath();cx.ellipse(6-a*fw,bob,5,3.2,0,0,7);cx.fill();cx.stroke();
  cx.beginPath();cx.arc(0,-15,14,0,7);cx.fill();cx.stroke();
  cx.fillStyle='#F2B5C4';cx.beginPath();cx.ellipse(f*8,-10,3.4,2.4,0,0,7);cx.fill();
  cx.fillStyle='#151716';
  if(o.wink){cx.lineWidth=2;cx.beginPath();cx.moveTo(f*4,-18);cx.lineTo(f*9,-19);cx.stroke();}
  else if(o.blink||Math.sin(t*1.7)>.985){cx.fillRect(f*6-3,-19,6,1.6);}
  else{cx.beginPath();cx.ellipse(f*6,-19,2,2.8,0,0,7);cx.fill();}
  if(o.fire){cx.beginPath();cx.ellipse(f*11,-11,3.5,4,0,0,7);cx.fill();}
  else{cx.lineWidth=1.6;cx.beginPath();cx.arc(f*9,-13,3,.2,Math.PI-.5);cx.stroke();}
  cx.restore();
}
function drawFlame(x,y,f,t){
  [[95,22,'#EF6A2F'],[72,15,'#FAE36B'],[42,8,'#FBF8F1']].forEach(([len,sp,c],k)=>{
    const fl=Math.sin(t*50+k*2)*4,l=len*(.9+.1*Math.sin(t*37+k));cx.fillStyle=c;cx.globalAlpha=.92;cx.beginPath();cx.moveTo(x,y-3);
    cx.quadraticCurveTo(x+f*l*.6,y-sp+fl,x+f*l,y+fl*.5);cx.quadraticCurveTo(x+f*l*.6,y+sp+fl,x,y+3);cx.fill();});cx.globalAlpha=1;
}
function drawGhost(x,y,sc,t,scream,crown){
  cx.save();cx.translate(x,y);cx.scale(sc,sc);cx.lineJoin='round';cx.lineWidth=2;cx.strokeStyle='#151716';
  cx.fillStyle=scream?'#ffd2b8':'#FBF8F1';
  cx.beginPath();cx.moveTo(-11,-24);cx.quadraticCurveTo(-11,-28,-7,-28);cx.lineTo(4,-28);cx.lineTo(11,-21);cx.lineTo(11,-2);
  cx.lineTo(7,2);cx.lineTo(3,-2);cx.lineTo(-1,2);cx.lineTo(-5,-2);cx.lineTo(-9,2);cx.lineTo(-11,-2);cx.closePath();cx.fill();cx.stroke();
  cx.fillStyle='#E3DFD5';cx.beginPath();cx.moveTo(4,-28);cx.lineTo(4,-21);cx.lineTo(11,-21);cx.closePath();cx.fill();cx.stroke();
  cx.fillStyle='#9FB7E0';cx.fillRect(-9,-25,10,5);cx.fillStyle='#151716';cx.font='700 4px sans-serif';cx.textAlign='left';cx.fillText('PNG',-8,-21.3);
  cx.beginPath();cx.ellipse(-4,-14,1.8,2.7,0,0,7);cx.ellipse(4,-14,1.8,2.7,0,0,7);cx.fill();
  cx.beginPath();cx.ellipse(0,-7,scream?3:2,scream?4.5:2.6,0,0,7);cx.fill();
  if(crown){cx.fillStyle='#FAE36B';cx.beginPath();cx.moveTo(-9,-28);cx.lineTo(-9,-36);cx.lineTo(-4,-31);cx.lineTo(0,-38);cx.lineTo(4,-31);cx.lineTo(9,-36);cx.lineTo(9,-28);cx.closePath();cx.fill();cx.stroke();}
  cx.restore();
}
function bubble(x,y,txt,col){cx.font='600 12px '+FONT;const w=cx.measureText(txt).width+16;cx.fillStyle=col||'#FBF8F1';cx.strokeStyle='#151716';cx.lineWidth=2;
  rr(x-w/2,y-24,w,24,10);cx.fill();cx.stroke();cx.beginPath();cx.moveTo(x-5,y);cx.lineTo(x,y+7);cx.lineTo(x+5,y);cx.fill();cx.fillStyle='#151716';cx.textAlign='center';cx.fillText(txt,x,y-8);}

/* ============ 玩家 / 输入 / 通用 ============ */
const FONT="'Outfit','DM Sans',-apple-system,'PingFang SC',sans-serif";
let P=null;const K={l:0,r:0,fire:0};const FL=95;
function resetPlayer(x){P={x:x||70,y:GY,vy:0,on:true,hp:3,face:1,inv:0,t:0,firing:false,meter:100,cool:false,fsfx:0,walking:false};}
function jump(){ac();if(state==='dialog'){dlgNext();return;}if(state!=='play'||paused||!L||L.noJump)return;if(P.on){P.vy=-540;P.on=false;sfx.jump();L.onJump&&L.onJump();}}
function physics(dt,o){
  o=o||{};const p=P;p.t+=dt;if(p.inv>0)p.inv-=dt;
  const d=(K.r?1:0)-(K.l?1:0);p.walking=!!d;
  if(d){const sp=(o.speed||150)*(!p.on?(o.air||1):1);p.x+=d*sp*dt;if(o.flip!==false)p.face=d;}
  p.x=clamp(p.x,o.minX||26,o.maxX||W-26);
  p.vy+=1700*dt;p.y+=p.vy*dt;
  const over=o.pits&&o.pits.some(q=>p.x>q.x0+6&&p.x<q.x1-6);
  if(p.y>=GY&&!over&&p.y-p.vy*dt<=GY+4){p.y=GY;p.vy=0;p.on=true;}else p.on=false;
}
function fireStep(dt,drain,regen,L){
  const p=P;if(L.noFire){p.firing=false;return;}
  if(K.fire&&p.meter>2&&!p.cool){p.firing=true;p.meter-=drain*dt;if(p.meter<=0){p.meter=0;p.firing=false;p.cool=true;}}
  else{p.firing=false;p.meter=Math.min(100,p.meter+regen*dt);if(p.cool&&p.meter>25)p.cool=false;}
  if(p.firing){p.fsfx-=dt;if(p.fsfx<=0){sfx.fire();p.fsfx=.38;}}
}
const inCone=(gx,gy,pad)=>{const mx=P.x+P.face*14,my=P.y-13,dx=(gx-mx)*P.face;return dx>-6&&dx<FL&&Math.abs(gy-my)<10+dx*.22+(pad||0);};
function burst(L,x,y,n,cols,sp){for(let i=0;i<n;i++)L.parts.push({x,y,vx:rnd(-1,1)*(sp||90),vy:rnd(-1.2,.3)*(sp||90),l:rnd(.4,.9),m:.9,c:cols[i%cols.length],s:rnd(2,4)});}
function partStep(L,dt){L.parts=L.parts.filter(p=>(p.l-=dt)>0);L.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;});}
function partDraw(L){L.parts.forEach(p=>{cx.globalAlpha=clamp(p.l/p.m,0,1);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s);});cx.globalAlpha=1;}
function hearts(){const n=Math.max(0,P.hp);return '<span class="c">'+'♥'.repeat(n)+'<span style="opacity:.3">'+'♥'.repeat(3-n)+'</span></span>';}
const bar=(v,c)=>'<span class="bar"><i style="width:'+(clamp(v,0,1)*100).toFixed(0)+'%;background:'+c+'"></i></span>';
function newLevel(ch){return {ch,t:0,cam:0,parts:[],msg:'',msgT:0,spawnT:1.4,say(m,t){this.msg=m;this.msgT=t||2.2;},fx:{}};}
function hurt(l,why){if(P.inv>0)return false;P.hp--;P.inv=1.3;P.vy=-300;P.on=false;sfx.hit();burst(l,P.x,P.y-14,8,['#FAE36B','#EF6A2F'],120);if(P.hp<=0){fail('体力耗尽',why||'被 PNG 淹没了……系统温馨提示：请重试。');}return true;}
function ghostStep(l,dt,onPass){
  l.ghosts.forEach(g=>{g.x+=g.vx*dt;g.yo=-Math.abs(Math.sin(l.t*6+g.ph))*g.amp;
    if(!g.p&&g.x<P.x-14){g.p=true;onPass&&onPass(g);}
    const gy=GY+g.yo;if(Math.abs(g.x-P.x)<18*(g.sc||1)*.7+8&&P.y>gy-26*(g.sc||1)&&P.y-24<gy&&hurt(l)){g.dead=true;burst(l,g.x,gy-12,6,['#FBF8F1','#E3DFD5'],100);}});
  l.ghosts=l.ghosts.filter(g=>!g.dead&&g.x>-50);
}
const mkGhost=(x,vx,amp)=>({x,vx,amp:amp==null?6:amp,ph:rnd(0,6),burn:0,yo:0});
function drawGhosts(l){l.ghosts.forEach(g=>drawGhost(g.x,GY+g.yo,g.sc||1,l.t,g.burn>0));}
function drawPlayer(l,extra){drawDino(P.x,P.y,P.face,P.t,{on:P.on,walk:P.walking&&P.on,fire:P.firing,inv:P.inv>0});if(P.firing)drawFlame(P.x+P.face*14,P.y-13,P.face,l.t);}

  if(isNew){toast('叮！守则第 '+n+' 条已记录');openBook(n,showMenu);}else showMenu();}
function fail(title,msg){if(state==='fail'||state==='won')return;state='fail';sfx.hit();P.firing=false;const r=$('#res');r.className='';
  r.innerHTML='<h3>'+title+'</h3><p>'+msg+'</p><div class="row"><button class="btn" id="rt">重试</button><button class="btn g" id="rb">返回目录</button></div>';$('#rt').onclick=retry;$('#rb').onclick=showMenu;}
function retry(){$('#res').classList.add('hidden');beginLevel(cur);}
function showReveal(cb){const r=$('#res');r.className='';state='dialog';
  r.innerHTML='<h3>王座上坐着的……</h3><div style="margin:6px auto 4px;width:150px;border:6px solid #151716;border-radius:6px;background:#FBF8F1;padding:5px;box-shadow:0 3px 0 rgba(0,0,0,.25)"><div style="background:#0b0c0c;color:#9BC5A3;font:9px/1.5 monospace;text-align:left;padding:5px 6px;height:76px;overflow:hidden;border-radius:2px">$ ./ocr_all.sh /tmp/*.png<br>[1/1] L00_发刊词_0001.png<br>&gt; text found: 1 line<br>&gt; 再来一张……<br>&gt; 再来一张……<br><span style="color:#EF6A2F">&gt; (忘了写 break)</span></div></div><p style="font:700 11px monospace;margin:2px 0 8px">L00_发刊词_0001.png</p><p style="font-size:12px;margin:0 0 10px">第一张截图。一切的开端。</p><div class="row"><button class="btn" id="rv">……收起</button></div>';
  $('#rv').onclick=()=>{r.classList.add('hidden');cb();};}
function openEnding(){if(!endReady())return;enterStage();cur=6;L=endScene('A');L.noJump=true;L.dx=W*.3;state='dialog';setCtl(null);$('#bL').style.display=$('#bR').style.display=$('#bF').style.display='none';hudLast='';$('#hud').innerHTML='';runDialog(ENDING,showChoice);}
function showChoice(){state='fail';const r=$('#res');r.className='';r.innerHTML='<h3>系统：「请选择。」</h3><p>要关掉系统，还是继续当清洁工？</p><div class="row"><button class="btn" id="cA">关掉系统</button><button class="btn o" id="cB">继续当清洁工</button></div>';
  $('#cA').onclick=()=>pick('A');$('#cB').onclick=()=>pick('B');}
function pick(k){save.choice=k;persist();L=endScene(k);state='end';sfx.chime();const r=$('#res');r.className='top';
  if(k==='A'){r.innerHTML='<h3>🎉 磁盘重见天日</h3><div class="big">+'+R.gb.toFixed(1)+' GB</div><p style="margin:0 0 8px;font-size:12px">小恐龙回到了 Knock 门口。<br>「谁在那？」「一只终于有了名字的小恐龙。」</p><div class="row"><button class="btn" id="eb">返回目录</button><button class="btn g" id="er">重选</button></div>';}
  else{r.innerHTML='<h3 style="color:#EF6A2F"><span id="sysB"></span></h3><p style="font-size:12px;margin:0 0 8px">系统（小声）：奖励 +∞ 任务积分（我的）。<br>小恐龙对你眨了眨眼。😉</p><div class="row"><button class="btn o" id="eb">接受任务（其实没得选）</button><button class="btn g" id="er">重选</button></div>';typeInto($('#sysB'),'【叮！新任务：清除 Downloads 里的 3,000 个安装包。】',28,null,true);}
  $('#eb').onclick=showMenu;$('#er').onclick=showChoice;}

/* ============ 主循环 / 输入 ============ */
let last=0;
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(state==='menu'||!L||$('#stage').classList.contains('hidden'))return;
  L.t+=dt;if(state==='play'&&!paused&&L.update)L.update(dt);
  else if(state==='won'||state==='end'||state==='dialog'||state==='fail'){if(L.parts)partStep(L,dt);if(state==='end'&&L.update)L.update(dt);P&&(P.t+=dt);}
  if(L.msgT>0&&!paused)L.msgT-=dt;
  cx.setTransform(DPR,0,0,DPR,0,0);cx.fillStyle=L.ch?PAL[L.ch].top:'#151716';cx.fillRect(0,0,CW,CH_);
  cx.setTransform(DPR*S,0,0,DPR*S,0,OY*DPR);L.draw();setHud();}
requestAnimationFrame(frame);
window.addEventListener('keydown',e=>{const k=e.key;
  if(k===' '||k==='ArrowUp'||k==='w'||k==='W'||k==='Enter'){if($('#focus').style.display!=='none')return;e.preventDefault();if(e.repeat&&state==='play')return;jump();}
  else if(k==='f'||k==='F'){K.fire=1;}else if(k==='ArrowLeft'||k==='a'||k==='A'){K.l=1;e.preventDefault();}else if(k==='ArrowRight'||k==='d'||k==='D'){K.r=1;e.preventDefault();}});
window.addEventListener('keyup',e=>{const k=e.key;if(k==='f'||k==='F')K.fire=0;else if(k==='ArrowLeft'||k==='a'||k==='A')K.l=0;else if(k==='ArrowRight'||k==='d'||k==='D')K.r=0;});
cv.addEventListener('pointerdown',e=>{e.preventDefault();jump();});
function hold(id,key){const b=$(id);const on=e=>{e.preventDefault();ac();K[key]=1;b.classList.add('on');},off=()=>{K[key]=0;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,off));}
hold('#bL','l');hold('#bR','r');hold('#bF','fire');
$('#bJ').addEventListener('pointerdown',e=>{e.preventDefault();jump();});
$('#bExit').addEventListener('click',()=>{ac();showMenu();});
$('#bBook').addEventListener('click',()=>{ac();openBook(0);});
$('#bMute').addEventListener('click',()=>{ac();save.muted=!save.muted;persist();$('#bMute').textContent=save.muted?'🔇':'🔊';});
$('#bMute').textContent=save.muted?'🔇':'🔊';
function showFocus(txt){$('#focus').querySelector('b').textContent=txt;$('#focus').style.display='flex';}
$('#focus').addEventListener('pointerdown',e=>{e.preventDefault();ac();window.focus();$('#focus').style.display='none';paused=false;if(!window.__started){window.__started=true;showMenu();}});
window.addEventListener('blur',()=>{K.l=K.r=K.fire=0;if(state==='play'){paused=true;showFocus('已暂停 · 点一下继续');}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){paused=true;showFocus('已暂停 · 点一下继续');}});

/* ============ 启动 ============ */
if(DEV)$('#devc').classList.remove('hidden');
resize();poll();setInterval(poll,5000);
renderMenu();
</script>
</body>
</html>
